# Documentation map.
#
# This file is the single ordered list of the documentation: docs/README.md (the hub),
# docs/llms.txt and docs/llms-full.txt are generated from it, and the sidebar of the
# documentation site will be too. Every Markdown page under docs/ must appear here
# except docs/plans/, the design records, which are ours and not a reader's;
# `make docs-check` fails when the map and the tree drift apart, and it reports a
# design record listed here as well. A summary is one sentence: it is what
# the hub and llms.txt print next to the link, so write it for a reader who is deciding
# whether to open the page.
groups:
  - id: getting-started
    title: Getting started
    summary: Install FoxxyCode, give it a model, run it for the first time and keep it updated.
    pages:
      - path: getting-started/quickstart.md
        title: Quickstart
        summary: From a fresh install to the first answer in five minutes, on the console, in the browser and from an editor.
      - path: getting-started/foxxycode-and-coddy.md
        title: FoxxyCode and coddy-agent
        summary: What this fork adds over upstream coddy-agent - the IDE plugins, the desktop window, the browser tool and the rest - and how it follows upstream.
      - path: getting-started/install.md
        title: Install
        summary: Release archives, Linux .deb and .rpm packages, Homebrew, the IntelliJ and VS Code plugins, Windows paths, manual placement.
      - path: getting-started/configuration.md
        title: Configuration
        summary: Where config.yaml lives, how to check it with -t and --dry-run, providers and models, SSH remote execution, the .env file.
      - path: getting-started/update.md
        title: Update
        summary: foxxycode update, release assets, installations owned by a package manager, the report of what changed.
      - path: getting-started/docker.md
        title: Docker
        summary: The GHCR image, docker compose, volumes and environment, the bundled UI on port 12345.
      - path: getting-started/homebrew.md
        title: Homebrew
        summary: The cask against the formula, which Homebrew repository takes what, the homebrew/core submission.
      - path: getting-started/troubleshooting.md
        title: Troubleshooting
        summary: What to check when the binary is not on PATH, the config does not load, a provider rejects the key, a port is busy or a surface is missing from the build.
  - id: surfaces
    title: Surfaces
    summary: The same agent and the same sessions from a terminal, a browser, an editor or a messenger.
    pages:
      - path: surfaces/console.md
        title: Console (TUI)
        summary: Bare foxxycode in a terminal, the layout, keys, slash commands, the local shell, print mode and remote mode.
      - path: surfaces/web-ui.md
        title: Web UI
        summary: The embedded single-page app served by foxxycode serve and foxxycode http, with sessions, the composer, modes and models, attachments, settings, themes and languages.
      - path: surfaces/editors.md
        title: Editors
        summary: The IntelliJ and VS Code plugins that run foxxycode http, and Zed, VS Code, Obsidian and scripts as ACP clients of foxxycode acp, and what they share with the other surfaces.
      - path: surfaces/gateway.md
        title: Telegram gateway
        summary: The Telegram bot adapter, setup, access levels, session isolation, rich messages, the same chat live in the browser, writing a new adapter.
  - id: operate
    title: Operate
    summary: Running FoxxyCode as a service, reaching it from elsewhere and bounding what it may do.
    pages:
      - path: operate/serve.md
        title: foxxycode serve and the daemon
        summary: One process for every enabled subsystem, --daemon with status, stop and restart, how a configuration change reaches a running process.
      - path: operate/remote.md
        title: Remote mode
        summary: Driving a remote foxxycode serve from the console, ACP or the web UI with --remote, tokens, CORS and the environment chip.
      - path: operate/swarm.md
        title: Swarm
        summary: Relays and nodes, mounts, the aggregated session list, rings and routes, the reverse tunnel.
      - path: operate/scheduler.md
        title: Scheduler
        summary: Cron job files, UTC firing rules, run sessions, the scheduler tools and REST.
      - path: operate/security.md
        title: Security and trust
        summary: What the agent may execute and how to bound it, permission modes, project trust for MCP servers, hooks and subagents, tokens and CORS, what is not sandboxed.
      - path: operate/debugging.md
        title: Diagnostics
        summary: The opt-in debug layer - raw LLM capture, the per-session trace and the loop events - and how to read them when a turn goes wrong.
  - id: features
    title: Features
    summary: What the agent can do and how each capability is configured.
    pages:
      - path: features/modes.md
        title: Operating modes
        summary: agent, plan, docs, ask and debug, which tools each mode allows and how to switch on every surface.
      - path: features/sessions.md
        title: Sessions
        summary: Session bundles on disk, resuming, branches from an edited message, todo lists, the sessions CLI.
      - path: features/rules.md
        title: Rules
        summary: Project rules from the .foxxycode, .agents, .cursor, .claude and .codex folders, nested AGENTS.md, dialects by extension, activation.
      - path: features/skills.md
        title: Skills
        summary: SKILL.md packs as slash commands, skills.dirs, the registries and the plugin command.
      - path: features/subagents.md
        title: Subagents
        summary: spawn_agent, definition files, the built-ins, project trust receipts, capability narrowing, child sessions.
      - path: features/hooks.md
        title: Hooks
        summary: Lifecycle hooks in Claude Code's hooks.json shape, events, matchers, the stdin payload, exit codes and JSON answers, project trust.
      - path: features/mcp.md
        title: MCP servers
        summary: Connecting MCP servers over stdio, streamable HTTP and SSE, mcp.json files, workspace trust, enable switches, the management API.
      - path: features/browser-tool.md
        title: Browser tool
        summary: The interactive browser the agent drives through Chrome, screenshots handed back to the model, the browser switch and the build tag.
      - path: features/background-tasks.md
        title: Background tasks
        summary: Detached commands, the task pool, timeouts, adoption of long foreground commands, program-wide permission grants.
      - path: features/compaction.md
        title: Context compaction
        summary: /compact and automatic summarisation at a threshold, the kept recent turns, result eviction with keep_result.
      - path: features/memory.md
        title: Long-term memory
        summary: The memory copilot, what it recalls and saves, the storage layout, configuration and cost.
      - path: features/session-export.md
        title: Session export
        summary: /export and foxxycode sessions export, formats, path rules, trimming options, the JSON document.
  - id: reference
    title: Reference
    summary: Complete lists, generated from the code wherever the code is the source of truth.
    pages:
      - path: reference/cli.md
        title: CLI reference
        summary: Every command, verb and flag of the foxxycode binary, generated from --help.
      - path: reference/config.md
        title: config.yaml reference
        summary: Every field of config.yaml with its type, default and description, generated from the schema, plus the self-configuration tools.
      - path: reference/environment-variables.md
        title: Environment variables
        summary: Every variable the binary reads, what it overrides and where it is documented.
      - path: reference/slash-commands.md
        title: Slash commands
        summary: The built-in commands on each surface and how skills become commands.
      - path: reference/keyboard.md
        title: Keyboard
        summary: The keys of the console TUI and of the web UI composer.
      - path: reference/tools.md
        title: Tools
        summary: The built-in tools the model can call, their arguments, permissions and the modes that expose them.
      - path: reference/http-api.md
        title: HTTP API
        summary: The OpenAI-compatible endpoints and the /foxxycode REST surface, authentication, sessions and headers, the OpenAPI document.
      - path: reference/acp-protocol.md
        title: ACP protocol
        summary: How foxxycode acp implements the Agent Client Protocol, methods, notifications, permission and question requests.
  - id: tutorials
    title: Tutorials
    summary: Task-shaped guides, each a complete path from a goal to a working result, with the configs and commands to copy, the check that it worked and what tends to go wrong.
    pages:
      - path: tutorials/foxxycode-in-ci.md
        title: FoxxyCode in CI
        summary: A workflow file that runs foxxycode -p on every pull request, with the key in a secret and the answer in the job log.
      - path: tutorials/telegram-bot-for-a-team.md
        title: A Telegram bot for a team
        summary: "One bot for a team with foxxycode serve: the token, who may talk to it, group isolation, and the same chat live in the browser."
      - path: tutorials/project-set-up-for-agents.md
        title: A project set up for agents
        summary: "A repository that teaches any agent how it works: rules, AGENTS.md, skills, an MCP server and the trust receipts."
      - path: tutorials/server-driven-from-a-laptop.md
        title: A server driven from a laptop
        summary: A foxxycode serve on a machine with the models and the workspace, driven from a laptop over the console, an editor and the browser.
      - path: tutorials/a-skill-of-your-own.md
        title: A skill of your own
        summary: A SKILL.md that becomes a slash command on every surface, from the first file to a registry install.
      - path: tutorials/swarm-relay-and-nodes.md
        title: A relay and its nodes in Docker
        summary: A Compose stand with a relay and nodes that dial out to it, the tokens, the checks, a mounted node from the console and the browser, scaling by adding nameless workers.
      - path: tutorials/swarm-multi-hop.md
        title: A chain of relays
        summary: A second relay behind the first with its own nodes, two-hop mounts, the recursive session list, rings and alternates.
      - path: tutorials/swarm-remote-nodes.md
        title: Working with remote nodes
        summary: Driving a node behind a relay from the console, an editor and the browser, what runs where, and which credential opens what.
  - id: contributing
    title: Contributing
    summary: How FoxxyCode is built, tested, documented and released.
    pages:
      - path: ../CONTRIBUTING.md
        title: Contributing guide
        summary: The development environment, the branch and pull request flow, what every change must carry.
      - path: contributing/documentation.md
        title: Writing documentation
        summary: Page types, the navigation map, screenshots, the assets index, generated references and the checks that guard them.
      - path: contributing/architecture.md
        title: Architecture
        summary: System design and component overview, package boundaries, session modes, the directory structure.
      - path: contributing/build.md
        title: Build from source
        summary: Prerequisites, make build, TAGS against go build -tags, the release binaries and the distribution packages.
      - path: contributing/custom-tools.md
        title: Custom tools
        summary: Adding a built-in tool to the registry, its schema and permission wiring, with a complete example.
      - path: contributing/react-agent.md
        title: ReAct agent
        summary: The loop design, the system prompt structure, the tool-calling contract and mode-specific behaviour.
      - path: ../DESIGN.md
        title: Web UI design
        summary: Tokens, layout and component contracts of the embedded SPA.
      - path: contributing/intellij-embedding.md
        title: Embedding the UI in IntelliJ
        summary: How the JCEF panel hosts the SPA - the Chromium 104 baseline, the embed markers, the theme bridge and the window API the plugin calls.
      - path: contributing/release-setup.md
        title: Release setup
        summary: How releases of this fork are published on GitHub - the workflows, the tags and the artefacts, the desktop build included (in Russian).
      - path: contributing/codex-hooks.md
        title: Codex hooks
        summary: How the Cursor rules reach a Codex CLI session working on this repository.
      - path: contributing/opencode-hooks.md
        title: OpenCode hooks
        summary: Deterministic delivery of the Cursor rules to OpenCode sessions working on this repository.
      - path: contributing/zcode-hooks.md
        title: ZCode hooks
        summary: Deterministic delivery of the Cursor rules to ZCode sessions working on this repository.
      - path: contributing/syntax-highlighting-audit.md
        title: Syntax highlighting audit
        summary: The NeuralDeep audit of code highlighting across the seven themes, its fixtures and how to re-run it.
      - path: ../AGENTS.md
        title: Agent notes
        summary: The repository map and contributor notes for coding agents.
