upstream: https://github.com/coddy-project/coddy-agent
notes: 'Historical decisions migrated from the local UPSTREAM_SYNC.md journal and checked against Git objects and
  fork ancestry. Coverage: bc1afb9 (exclusive) through 4b091359 (inclusive), plus the explicitly partial PR #351.
  Before bc1afb9, only ports explicitly named by fork commit messages are reconstructed; the shared base is 9370936.
  Absence means unreviewed, not unported. Adapted means the recorded consolidated net-diff port, including intentional
  branding, API, localization and media differences; it does not assert a patch-identical cherry-pick, a new semantic
  audit or completion of every historical live-test/documentation follow-up. fork_commits may identify an implementation
  bundle or its merge. The journal sometimes names branch tips as release checkpoints; the 1.1.51-1.1.61 records
  use actual upstream main merges. The 2026-10-07 wave separately reviews 4b091359e027df31acf00d32378f112b8af4dba6
  (exclusive) through 75c31bcc0b726a46386b0977fee997353f62a9a1 (inclusive, tag 1.2.1): 38 constituent commits, 10
  PR merges and 6 overlapping integration merges. The latter are skipped as redundant, rather than applied twice.
  The 2026-10-14 wave covers the next 24 constituent commits through 5ed775c47789a5c9ec49cfb66c0d575730599cf8 (tag
  1.2.10), completing the partial/deferred PR #351 records. The 2026-10-16 wave covers the next 67 commits through
  a9ed5bbc88916fb7b95f27fa9558104c7ddee1f5 (tag 1.2.18). The 2026-10-20 wave covers the next 45 commits through
  24bf9b367767bb0a76193c4dac57ab03b0203365 (commit of annotated tag 1.2.27): 41 adapted constituent/PR-merge records
  and 4 redundant integration merges skipped. The 2026-10-26 wave covers the next 66 commits through
  419c6930450a0e3107021ad7ad0b858542d0245b (tag 1.2.35): 60 adapted records and 6 redundant integration
  merges skipped. Commits after that checkpoint remain unreviewed unless listed individually.'
