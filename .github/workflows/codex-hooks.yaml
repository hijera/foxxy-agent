# Exercise the Windows hook launcher with Unicode paths and native shell decoding.
name: Codex hooks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".codex/hooks.json"
      - ".codex/hooks/**"
      - "scripts/test_codex_hooks.py"
      - ".github/workflows/codex-hooks.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Codex hook launcher (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run the launcher regression tests
        run: python -X utf8 scripts/test_codex_hooks.py
