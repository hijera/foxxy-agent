# Build the JetBrains (IntelliJ-platform) plugin: a single cross-platform zip that bundles the
# foxxycode binary for every desktop target under foxxycode-bin/<os>-<arch>/.
#
# Triggers:
#   - pull_request touching the plugin or the Go/UI sources it bundles -> build + upload artifact
#   - workflow_dispatch -> build + upload artifact
#   - workflow_call from "Tag release on merge" (tag input) -> build + attach zip to the Release
#   - push SemVer tag -> build + attach zip to the Release
#
# Release builds also republish the JetBrains plugin repository document (updatePlugins.xml),
# which is what makes the plugin update itself inside the IDE: to docs/ on main (published on
# GitHub Pages by site.yaml, which "Tag release on merge" calls after this job; the URL users
# paste into Manage Plugin Repositories) and as an asset on the Release. See
# docs/contributing/release-setup.md.

name: IntelliJ plugin

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "editors/intellij/**"
      - "cmd/**"
      - "internal/**"
      - "external/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/intellij-plugin.yaml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: SemVer git tag to build and attach (X.Y.Z)
        required: true
        type: string
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach assets to the Release on tag builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must match X.Y.Z (got ${TAG})." >&2
              exit 1
            fi
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: external/ui/package-lock.json

      # buildPlugin does not run the test task, so the Kotlin suite needs its own
      # step or it never executes in CI.
      - name: Run plugin unit tests
        run: make intellij-test

      - name: Build plugin (all platforms)
        run: make intellij-build PLUGIN_VERSION="${{ steps.ver.outputs.version }}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxxycode-intellij-${{ steps.ver.outputs.version }}
          path: editors/intellij/build/distributions/*.zip
          if-no-files-found: error

      - name: Attach plugin to GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: editors/intellij/build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything below publishes the plugin repository document. A JetBrains custom plugin
      # repository is nothing but a URL serving this one XML file, so no server is needed: the
      # document points straight at the zip attached above. These steps run only after that
      # attach, so a failure here marks the job red but can never cost a release its plugin.
      # The generator is built once and reused, because this job is checked out at the tag
      # while the published copy lives on main.
      - name: Build the plugin repository generator
        if: steps.ver.outputs.release == 'true'
        run: go build -o "${RUNNER_TEMP}/updateplugins" ./editors/intellij/updateplugins

      - name: Generate updatePlugins.xml
        if: steps.ver.outputs.release == 'true'
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/updateplugins" \
            -zip "$(ls editors/intellij/build/distributions/*.zip)" \
            -tag "${{ steps.ver.outputs.version }}" \
            -repo "${{ github.repository }}" \
            -out "${RUNNER_TEMP}/updatePlugins.xml" \
            -force
          cat "${RUNNER_TEMP}/updatePlugins.xml"

      # Backs the .../releases/latest/download/updatePlugins.xml URL.
      - name: Attach updatePlugins.xml to GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.ver.outputs.version }}" "${RUNNER_TEMP}/updatePlugins.xml" \
            --repo "${{ github.repository }}" \
            --clobber

      # GitHub Pages publishes docs/ from main (site.yaml, run by the caller after this job), so
      # publishing means committing there. A second,
      # shallow checkout keeps the tag checkout and its build tree untouched.
      - name: Check out main for the plugin repository
        if: steps.ver.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: main-checkout

      # Regenerated against main's copy rather than copied from the step above, so the
      # generator can refuse to walk IDEs backwards when an older tag is rebuilt.
      #
      # Every path is absolute and git runs with -C instead of cd: the first live run took the
      # zip path relative to the workspace, changed into main-checkout, and lost the zip.
      # editors/intellij/updateplugins/workflow_test.go runs this script against a local remote.
      - name: Publish updatePlugins.xml to GitHub Pages
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="$(ls "${GITHUB_WORKSPACE}"/editors/intellij/build/distributions/*.zip)"
          MAIN="${GITHUB_WORKSPACE}/main-checkout"
          git -C "$MAIN" config user.name "github-actions[bot]"
          git -C "$MAIN" config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git -C "$MAIN" fetch --depth 1 origin main
            git -C "$MAIN" reset --hard origin/main
            "${RUNNER_TEMP}/updateplugins" \
              -zip "$ZIP" \
              -tag "$VERSION" \
              -repo "${{ github.repository }}" \
              -out "$MAIN/docs/updatePlugins.xml"
            # Staged, not working-tree: on a checkout where the document is not tracked yet
            # "git diff" reports nothing and the publish would silently do nothing.
            git -C "$MAIN" add docs/updatePlugins.xml
            if git -C "$MAIN" diff --cached --quiet -- docs/updatePlugins.xml; then
              echo "The plugin repository already advertises this build; nothing to publish."
              exit 0
            fi
            git -C "$MAIN" commit -m "chore(intellij): advertise ${VERSION} in the plugin repository"
            if git -C "$MAIN" push origin HEAD:main; then
              echo "Published https://$(echo "${{ github.repository }}" | cut -d/ -f1).github.io/$(echo "${{ github.repository }}" | cut -d/ -f2)/updatePlugins.xml"
              exit 0
            fi
            echo "main moved while publishing (attempt ${attempt}); retrying."
          done
          echo "Could not publish updatePlugins.xml to main after 3 attempts." >&2
          exit 1
